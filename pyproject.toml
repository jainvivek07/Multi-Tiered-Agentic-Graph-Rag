[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vivek-jain01", email = "vivek.jain01@nagarro.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "docling>=2.127.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "flashrank>=0.2.10",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "langsmith>=0.12.5",
    "litellm>=1.101.0",
    "neo4j>=6.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
    "nemoguardrails>=0.13.0",
    "lettucedetect>=0.2.0",
    "numpy>=1.26.0",
    "langchain-text-splitters>=1.1.2",
    "celery[redis]>=5.4.0",
    "starlette-csrf>=3.0.0",
    "redisvl>=0.27.2",
    "slowapi>=0.1.10",
    "supabase>=2.32.0",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
